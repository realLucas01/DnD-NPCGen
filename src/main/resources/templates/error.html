<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Error</title>

        <!-- Bootstrap CSS von CDN -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

        <!-- Eigenes CSS -->
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>

    <body>

    <div class="container text-center mt-5">
        <h1 class="display-4 text-danger">Oops! Something went wrong.</h1>
        <p class="lead">We're sorry, but an unexpected error occurred.</p>

        <p th:if="${status}" class="text-muted">
            <strong>Error Code:</strong> <span th:text="${status}"></span>
        </p>

        <p th:if="${error}" class="text-muted">
            <strong>Error Message:</strong> <span th:text="${error}"></span>
        </p>

        <a href="/" class="btn btn-primary mt-3">Back to Home</a>
    </div>

    </body>
    <!-- Bootstrap JavaScript über CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
</html>
