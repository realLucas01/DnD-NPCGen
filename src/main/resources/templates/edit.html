<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
    <head>
        <title>Edit</title>

        <!-- Bootstrap CSS von CDN -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

        <!-- HTMX -->
        <script src="https://unpkg.com/htmx.org@1.9.5"></script>

        <!-- own CSS -->
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>

    <!-- TODO: replace "Zufall" with "Random" -->

    <body>
        <!-- NavBar -->
        <div th:replace="~{fragments/navbar :: nav}"></div>


        <!-- NPC first changes (Name, Class, Alignment, Race) -->
        <form th:action="@{/editFirst}" method="post" class="container mt-4">
            <!-- Name -->
            <div class="row mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" id="name" name="name" class="form-control" th:value="${name}" th:disabled="${switch}">
            </div>

            <!-- Race -->
            <div class="row mb-3">
                <label for="race" class="form-label">Race:</label>
                <select id="race" name="race" class="form-select" th:disabled="${switch}">
                    <!-- Default options -->
                    <option value="Zufall" th:selected="${race == 'Zufall'}" th:disabled="${switch}">Zufall</option>
                    <option th:each="rac : ${races}" th:value="${rac}" th:text="${rac}" th:selected="${rac == race}">
                    </option>

                    <!-- New options, only when switch == true -->
                    <option th:if="${switch}" th:value="${selectedRace}" th:selected="${selectedRace}" th:text="${selectedRace}"></option>
                </select>
            </div>

            <!-- Class -->
            <div class="row mb-3">
                <label for="class" class="form-label">Class:</label>
                <select id="class" name="genClass" class="form-select" th:disabled="${switch}">
                    <option value="Zufall" th:selected="${class == 'Zufall'}">Zufall</option>
                    <option th:each="cla : ${classes}" th:value="${cla}" th:text="${cla}" th:selected="${cla == class}">
                    </option>

                    <!-- New options, only when switch == true -->
                    <option th:if="${switch}" th:value="${selectedClass}" th:selected="${selectedClass}" th:text="${selectedClass}"></option>
                </select>
            </div>

            <!-- Alignment -->
            <div class="row mb-3">
                <label for="alignment" class="form-label">Alignment:</label>
                <select id="alignment" name="alignment" class="form-select" th:disabled="${switch}">
                    <option value="Zufall" th:selected="${alignment == 'Zufall'}">Zufall</option>
                    <option th:each="align : ${alignments}" th:value="${align}" th:text="${align}" th:selected="${align == alignment}">
                    </option>

                    <!-- New options, only when switch == true -->
                    <option th:if="${switch}" th:value="${selectedAlignment}" th:selected="${selectedAlignment}" th:text="${selectedAlignment}"></option>
                </select>
            </div>



            <div class="row mb-3 text-center" th:if="${!switch}">
                <button type="submit" class="btn btn-primary w-100">Next</button>
            </div>
        </form>

        <!-- NPC all changes -->
        <div class="container mt-4" th:if="${switch}">
            <!-- Level -->
            <div class="row mb-3">
                <label for="level" class="form-label">Level:</label>

                <select id="level" name="value" class="form-select"
                        hx-post="/updateField"
                        hx-trigger="change"
                        hx-include="[name='field'], this"
                        hx-swap="none">

                    <option value="Zufall">Zufall</option>
                    <option th:each="l : ${#numbers.sequence(1,20)}" th:value="${l} + ';level'" th:text="${l}"
                            th:selected="${l == level}"></option>
                </select>
            </div>


            <!-- Jobs -->
            <div class="row mb-3">
                <label for="job" class="form-label">Job:</label>

                <select id="job" name="value" class="form-select"
                        hx-post="/updateField"
                        hx-trigger="change"
                        hx-include="[name='field'], this"
                        hx-swap="none">

                    <option value="Zufall" th:selected="${updateNPC.job == 'Zufall'}">Zufall</option>
                    <option th:each="j : ${jobs}"
                            th:value="${j} + ';job'"
                            th:text="${j}"
                            th:selected="${j == updateNPC.job}">
                    </option>
                </select>
            </div>

            <!-- Deities -->
            <div class="row mb-3">
                <label for="deity" class="form-label">Deities:</label>
                <select id="deity" name="value" class="form-select"
                        hx-post="/updateField"
                        hx-trigger="change"
                        hx-include="[name='field'], this"
                        hx-swap="none">

                    <option th:each="deityValue : ${deities}" th:value="${deityValue} + ';deity'" th:text="${deityValue}"
                            th:selected="${deityValue == updateNPC.deity}"></option>
                </select>
            </div>

            <!-- Sex -->
            <fieldset class="row mb-3">
                <legend class="col-form-label">Sex:</legend>
                <div class="col-sm-10">
                    <div class="form-check">
                        <input type="radio" name="value" value="Random;gender" id="genderRandom" class="form-check-input"
                               th:checked="${sex == 'Random'}"
                               hx-post="/updateField"
                               hx-trigger="change"
                               hx-include="[name='field'], this"
                               hx-swap="none">
                            <label for="genderRandom" class="form-check-label">Random</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" name="value" value="male;gender" id="genderMale" class="form-check-input"
                               th:checked="${sex == 'male'}"
                               hx-post="/updateField"
                               hx-trigger="change"
                               hx-include="[name='field'], this"
                               hx-swap="none">
                        <label for="genderMale" class="form-check-label">Male</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" name="value" value="female;gender" id="genderFemale" class="form-check-input"
                               th:checked="${sex == 'female'}"
                               hx-post="/updateField"
                               hx-trigger="change"
                               hx-include="[name='field'], this"
                               hx-swap="none">
                        <label for="genderFemale" class="form-check-label">Female</label>
                    </div>
                </div>
            </fieldset>

            <!-- Age -->
            <div class="row mb-3">
                <label for="age" class="form-label">Age:</label>
                <input id="age" name="value" type="number" class="form-control" th:value="${age}" min="0" hx-post="/updateField"
                       hx-trigger="change"
                       hx-include="[name='field'], this"
                       hx-swap="none"/>
            </div>


            <!-- AC -->
            <div class="row mb-3">
                <label for="AC" class="form-label">Armor Class (AC):</label>
                <input id="AC" name="AC" type="number" class="form-control" th:value="${AC}" min="0" />
            </div>

            <!-- HP -->
            <div class="row mb-3">
                <label for="HP" class="form-label">Hit Points (HP):</label>
                <input id="HP" name="HP" type="number" class="form-control" th:value="${HP}" min="0" />
            </div>

            <!-- Speed -->
            <div class="row mb-3">
                <!-- Walking Speed -->
                <div class="col-6">
                    <label for="walkingSpeed" class="form-label">Walking speed:</label>
                    <div class="input-group">
                        <input id="walkingSpeed" name="walkingSpeed" type="number" class="form-control" th:value="${walkingSpeed}" min="0" />
                        <span class="input-group-text">ft</span>
                    </div>
                </div>

                <!-- Flying Speed -->
                <div class="col-6">
                    <label for="flyingSpeed" class="form-label">Flying speed:</label>
                    <div class="input-group">
                        <input id="flyingSpeed" name="flyingSpeed" type="number" class="form-control" th:value="${flyingSpeed}" min="0" />
                        <span class="input-group-text">ft</span>
                    </div>
                </div>
            </div>

            <!-- Languages -->
            <div class="include-modal">
                <div class="row mb-3">
                    <div class="d-flex align-items-center">
                        <label class="form-label me-2 mb-0"><b>Languages:</b></label>
                        <!-- List of Languages -->
                        <p th:text="${language}" class="form-control-plaintext mb-0"></p>
                    </div>

                    <!-- Button to open the pop-up -->
                    <button type="button" class="btn btn-primary mt-2" data-bs-toggle="modal" data-bs-target="#languagesModal">
                        Choose Languages
                    </button>
                </div>

                <!-- Modal -->
                <form th:action="@{/editLanguages}" method="post">
                    <div class="modal fade" id="languagesModal" tabindex="-1" aria-labelledby="languagesModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="languagesModalLabel">Available languages</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="row g-2">
                                        <!-- List of languages -->
                                        <div th:each="lang : ${languages}" class="col-md-6">
                                            <div class="card">
                                                <div class="card-body">
                                                    <!-- Checkbox for the language -->
                                                    <input type="checkbox"
                                                           th:id="${'language_' + lang}"
                                                           th:name="lang"
                                                           th:value="${lang}"
                                                           th:checked="${language.contains(lang)}"
                                                           class="form-check-input me-2">
                                                    <label th:for="${'language_' + lang}" class="form-check-label" th:text="${lang}"></label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                    <button type="submit" class="btn btn-primary">Save</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Ability Scores & Saving Throws -->
            <div class="container mt-3">
                <div class="row border rounded p-3 bg-light">
                    <h3>Stats</h3>

                    <div class="table-responsive">
                        <table class="table table-borderless">
                            <thead>
                            <tr>
                                <th></th>
                                <th th:each="ability : ${allAbilities}" th:text="${ability}"></th>
                            </tr>
                            </thead>
                                <tbody>
                                    <!-- Ability Scores with Modifiers -->
                                    <tr>
                                        <th>Ability Scores</th>
                                        <td th:each="index : ${#numbers.sequence(0, allAbilities.size()-1)}">
                                            <div class="d-flex flex-column align-items-center">
                                                <!-- Ability Scores -->
                                                <input type="number"
                                                       name="value"
                                                       th:value="${abilityScores[index]}"
                                                       th:data-key="${allAbilities[index]}"
                                                       hx-post="/editAbility"
                                                       hx-include="closest div"
                                                       hx-trigger="change"
                                                       style="width: 70px;"
                                                       class="form-control mb-1">


                                                <!-- Modifier -->
                                                <input type="number"
                                                       name="value"
                                                       th:value="${abilityModifiers[index]}"
                                                       th:data-key="${allAbilities[index]}"
                                                       hx-post="/editModifier"
                                                       hx-include="closest div"
                                                       hx-trigger="change"
                                                       style="width: 70px;"
                                                       class="form-control">
                                                <input type="hidden" name="key" th:value="${index}">
                                            </div>
                                        </td>
                                    </tr>


                                    <!-- Saving Throws (if applicable) -->
                                    <tr th:if="${not #lists.isEmpty(savingThrows)}">
                                        <th>Saving Throws</th>
                                        <td th:each="entry : ${savingThrows}">
                                            <!-- Number field for the value -->
                                            <input type="number"
                                                   name="value"
                                                   th:value="${entry.value}"
                                                   min="0"
                                                   max="20"
                                                   hx-post="/editSavingThrows"
                                                   hx-include="closest td"
                                                   hx-trigger="change"
                                                   style="width: 70px;">

                                            <!-- Key input (hidden) -->
                                            <input type="hidden"
                                                   name="key"
                                            th:value="${entry.key}">
                                        </td>
                                    </tr>

                                </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Inventory -->
            <div class="row mb-3 include-modal">
                <!-- Armor -->
                    <div class="col-6">
                        <!-- List of the NPCs armors -->
                        <div class="d-flex align-items-center">
                            <label class="form-label me-2 mb-0"><b>Armors:</b></label>
                            <p th:text="${armor}" class="form-control-plaintext mb-0"></p>
                        </div>

                        <!-- Button to open the pop-up -->
                        <button type="button" class="btn btn-primary mt-2" data-bs-toggle="modal" data-bs-target="#armorsModal">
                            Choose armors
                        </button>
                    </div>

                <!-- Weapon -->
                    <div class="col-6">
                        <!-- List of the NPCs weapons -->
                        <div class="d-flex align-items-center">
                            <label class="form-label me-2 mb-0"><b>Weapons:</b></label>
                            <p th:text="${weapon}" class="form-control-plaintext mb-0"></p>
                        </div>

                        <!-- Button to open the pop-up -->
                        <button type="button" class="btn btn-primary mt-2" data-bs-toggle="modal" data-bs-target="#weaponsModal">
                            Choose weapons
                        </button>
                    </div>

                <!-- Armor Modal -->
                <form th:action="@{/editArmors}" method="post">
                    <div class="modal fade" id="armorsModal" tabindex="-1" aria-labelledby="armorsModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="armorsModalLabel">available armors</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="row g-2">
                                        <!-- List of all armors -->
                                        <div th:each="arm : ${armors}" class="col-md-6">
                                            <div class="card">
                                                <div class="card-body">
                                                    <!-- Checkbox for the armors -->
                                                    <input type="checkbox"
                                                           th:id="${'armor_' + arm}"
                                                           th:name="arm"
                                                           th:value="${arm}"
                                                           th:checked="${armor.contains(arm)}"
                                                           class="form-check-input me-2">
                                                    <label th:for="${'armor_' + arm}" class="form-check-label" th:text="${arm}"></label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                    <button type="submit" class="btn btn-primary">Save</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>

                <!-- Weapon Modal -->
                <form th:action="@{/editWeapons}" method="post">
                    <div class="modal fade" id="weaponsModal" tabindex="-1" aria-labelledby="weaponsModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="weaponsModalLabel">available weapons</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="row g-2">
                                        <!-- List of all weapons -->
                                        <div th:each="wea : ${weapons}" class="col-md-6">
                                            <div class="card">
                                                <div class="card-body">
                                                    <!-- Checkbox for weapons -->
                                                    <input type="checkbox"
                                                           th:id="${'weapon_' + wea}"
                                                           th:name="wea"
                                                           th:value="${wea}"
                                                           th:checked="${weapon.contains(wea)}"
                                                           class="form-check-input me-2">
                                                    <label th:for="${'weapon_' + wea}" class="form-check-label" th:text="${wea}"></label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                    <button type="submit" class="btn btn-primary">Save</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>




            <!-- TODO Skills -->
            <!-- Skills -->
            <div class="include-modal">
                <div class="row mb-3">
                    <div class="d-flex align-items-center">
                        <label class="form-label me-2 mb-0"><b>Skills:</b></label>
                        <!-- List of skills -->
                        <p th:text="${skills}" class="form-control-plaintext mb-0"></p>
                    </div>

                    <!-- Button to open the pop-up -->
                    <button type="button" class="btn btn-primary mt-2" data-bs-toggle="modal" data-bs-target="#skillsModal">
                        Choose Skills
                    </button>
                </div>

                <!-- Modal -->
                <form th:action="@{/editSkills}" method="post">
                    <div class="modal fade" id="skillsModal" tabindex="-1" aria-labelledby="skillsModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="skillsModalLabel">Available skills</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="row g-2">
                                        <!-- List of skills -->
                                        <div th:each="skill : ${availableSkills}" class="col-md-6">
                                            <div class="card">
                                                <div class="card-body">
                                                    <!-- Checkbox for the skill -->
                                                    <input type="checkbox"
                                                           th:id="${'skill_' + skill}"
                                                           th:name="skill"
                                                           th:value="${skill}"
                                                           th:checked="${skills.contains(skill)}"
                                                           class="form-check-input me-2">
                                                    <label th:for="${'skill_' + skill}" class="form-check-label" th:text="${skill}"></label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                    <button type="submit" class="btn btn-primary">Save</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>





            <!-- TODO Senses -->
            <!-- Senses -->
            <div class="row mb-3">
                <div class="d-flex align-items-center">
                    <label class="form-label mb-2"><b>Senses:</b></label>
                    <!-- List of senses -->
                    <p th:text="${senses}" class="form-control-plaintext mb-0"></p>
                </div>

                <!-- Display checkbox list directly -->
                <div class="col-12">
                    <div class="row g-2">
                        <div th:each="sense : ${availableSenses}" class="col-md-6">
                            <div class="d-flex align-items-center">
                                <div class="form-check me-2">
                                    <input type="checkbox"
                                           th:id="${'sense_' + sense}"
                                           name="sense"
                                           th:value="${sense}"
                                           th:checked="${senses.keySet().contains(sense)}"
                                           class="form-check-input" />
                                    <label th:for="${'sense_' + sense}" class="form-check-label" th:text="${sense}"></label>
                                </div>

                                <div class="input-group" style="width: 120px;">
                                    <input type="number"
                                           th:name="${'senseRange_' + sense}"
                                           min="10" max="120" step="5"
                                           class="form-control"
                                           placeholder="10"
                                           th:value="${senses.get(sense) != null ? senses.get(sense) : 0}">
                                    <span class="input-group-text">ft.</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>



            <!-- TODO Spells -->

            <!-- TODO Description -->




            <!-- TODO Save redirect -->
            <div class="row mb-3 text-center">
                <form th:action="@{/saveNpc}" method="post">
                    <button type="submit" class="btn btn-primary w-100">Save</button>
                </form>
            </div>

        </div>

    </body>

    <!-- Bootstrap JavaScript über CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
</html>
