<!-- fragments/display_spell.html -->
<div class="container mt-3" th:fragment="spell">
    <div class="card row border rounded p-3">
        <div class="col-md-6">
            <h3>Spells</h3>

            <div th:if="${!spellCantrips.isEmpty()}">
                <strong>Cantrips:</strong>
                <ul>
                    <li th:each="spell : ${spellCantrips}" th:text="${spell}"></li>
                </ul>
            </div>

            <div th:if="${!spellFirstLevel.isEmpty()}">
                <strong>1st Level Spells:</strong>
                <ul>
                    <li th:each="spell : ${spellFirstLevel}" th:text="${spell}"></li>
                </ul>
            </div>

            <div th:if="${!spellSecondLevel.isEmpty()}">
                <strong>2nd Level Spells:</strong>
                <ul>
                    <li th:each="spell : ${spellSecondLevel}" th:text="${spell}"></li>
                </ul>
            </div>

            <div th:if="${!spellThirdLevel.isEmpty()}">
                <strong>3rd Level Spells:</strong>
                <ul>
                    <li th:each="spell : ${spellThirdLevel}" th:text="${spell}"></li>
                </ul>
            </div>

            <div th:if="${!spellFourthLevel.isEmpty()}">
                <strong>4th Level Spells:</strong>
                <ul>
                    <li th:each="spell : ${spellFourthLevel}" th:text="${spell}"></li>
                </ul>
            </div>

            <div th:if="${!spellFifthLevel.isEmpty()}">
                <strong>5th Level Spells:</strong>
                <ul>
                    <li th:each="spell : ${spellFifthLevel}" th:text="${spell}"></li>
                </ul>
            </div>

            <div th:if="${!spellSixthLevel.isEmpty()}">
                <strong>6th Level Spells:</strong>
                <ul>
                    <li th:each="spell : ${spellSixthLevel}" th:text="${spell}"></li>
                </ul>
            </div>

            <div th:if="${!spellSeventhLevel.isEmpty()}">
                <strong>7th Level Spells:</strong>
                <ul>
                    <li th:each="spell : ${spellSeventhLevel}" th:text="${spell}"></li>
                </ul>
            </div>

            <div th:if="${!spellEighthLevel.isEmpty()}">
                <strong>8th Level Spells:</strong>
                <ul>
                    <li th:each="spell : ${spellEighthLevel}" th:text="${spell}"></li>
                </ul>
            </div>

            <div th:if="${!spellNinthLevel.isEmpty()}">
                <strong>9th Level Spells:</strong>
                <ul>
                    <li th:each="spell : ${spellNinthLevel}" th:text="${spell}"></li>
                </ul>
            </div>
        </div>
    </div>
</div>
