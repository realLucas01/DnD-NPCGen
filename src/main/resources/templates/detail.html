<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
    <head>
        <title>Detail</title>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative&display=swap">

        <!-- Bootstrap CSS from CDN -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

        <!-- Own CSS -->
        <link rel="stylesheet" th:href="@{/css/styleDetail.css}">
    </head>

    <body>
        <!-- NavBar -->
        <div th:replace="~{fragments/navbar :: nav}"></div>


        <div class="container mt-4">
            <h1 class="text-center ueberschrift mb-4" th:text="${npc.name}">NPC Name</h1>

            <!-- General Information -->
            <div class="container mt-3">
                <div class="card row border rounded p-1">
                    <div class="row g-2">
                        <div class="col-md-6 text-center">
                            <div class="text-start d-inline-block">
                                <p><strong>Class:</strong> <span th:text="${npc.genClass}"></span></p>
                                <p><strong>Level:</strong> <span th:text="${npc.level}"></span></p>
                                <p><strong>Deity:</strong> <span th:text="${npc.deity}"></span></p>
                                <p><strong>Age:</strong> <span th:text="${npc.age}"></span></p>
                            </div>
                        </div>
                        <div class="col-md-6 text-center">
                            <div class="text-start d-inline-block">
                                <p><strong>Race:</strong> <span th:text="${npc.race}"></span></p>
                                <p><strong>Job:</strong> <span th:text="${npc.job}"></span></p>
                                <p><strong>Alignment:</strong> <span th:text="${npc.alignment}"></span></p>
                                <p><strong>Sex:</strong> <span th:text="${npc.gender}"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="container mt-3">
                <div class="card row border rounded p-3">
                    <h3>Stats</h3>

                    <div class="table-responsive">
                        <table class="color table table-borderless table-striped">
                            <thead>
                            <tr>
                                <th scope="col"></th>
                                <th scope="col" th:each="ability : ${allAbilities}" th:text="${ability}"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- Ability Scores with Modifiers -->
                            <tr>
                                <th scope="row">Ability Scores</th>
                                <td th:each="score : ${abilityScores}" th:text="${score}"></td>
                            </tr>
                            <!-- Saving Throws -->
                            <tr>
                                <th scope="row">Saving Throws</th>
                                <td th:each="savingThrow : ${savingThrows}">
                                    <span th:text="${savingThrow}"></span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- HP, AC, Movement & Languages -->
            <div class="container mt-3">
                <div class="card row border rounded p-3">
                    <h4>Defensive Stats</h4>
                    <div class="row">
                        <!-- Hit Points & Armor Class -->
                        <div class="col-md-6">
                            <strong>Hit Points:</strong> <span th:text="${npc.healthPoints}"></span>
                        </div>
                        <div class="col-md-6">
                            <strong>Armor Class:</strong> <span th:text="${npc.armorClass}"></span>
                        </div>
                    </div>

                    <h4>Movement Speed</h4>
                    <div class="row">
                        <div class="col-md-6">
                            <strong>Walking Speed:</strong> <span th:text="${walkingSpeed}"></span>
                        </div>
                        <div class="col-md-6" th:if="${flyingSpeed ne ''}">
                            <strong>Flying Speed:</strong> <span th:text="${flyingSpeed}"></span>
                        </div>
                    </div>

                    <h4>Languages</h4>
                    <div>
                        <span th:each="lang, iterStat : ${npc.languages}">
                            <span th:text="${lang}"></span><span th:if="${!iterStat.last}">, </span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Inventory -->
            <div class="container mt-3">
                <div class="card row border rounded p-3">
                    <h3>Inventory</h3>
                    <div class="row">
                        <!-- Armor -->
                        <div class="col-md-6">
                            <strong>Armor:</strong>
                            <ul>
                                <li th:text="${npc.armor}"></li>
                            </ul>
                        </div>

                        <!-- Weapons -->
                        <div class="col-md-6">
                            <strong>Weapons:</strong>
                            <ul>
                                <li th:each="weapon : ${npc.weaponList}" th:text="${weapon}"></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Skills & Senses -->
            <div class="container mt-3">
                <div class="card row border rounded p-3">
                    <h3>Skills & Senses</h3>
                    <div class="row">
                        <!-- Skills -->
                        <div class="col-md-6">
                            <strong>Skills:</strong>
                            <ul>
                                <li th:each="skill : ${npc.skillList}" th:text="${skill}"></li>
                            </ul>
                        </div>

                        <!-- Senses -->
                        <div class="col-md-6">
                            <strong>Senses:</strong>
                            <ul>
                                <li th:each="sense : ${senses}" th:text="${sense}"></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Spells -->
            <div th:replace="~{fragments/display_spell :: spell}"></div>

            <!-- Description -->
            <div class="container mt-3">
                <div class="card row border rounded p-3">
                    <div class="container mt-4">
                        <h3>Description</h3>
                        <div class="row">
                            <!-- Running text (left column) -->
                            <div class="col-md-6">
                                <div class="orange p-3 border rounded">
                                    <p th:text="${descriptionText}"></p>
                                </div>
                            </div>

                            <!-- List (right column) -->
                            <div class="col-md-6">
                                <div class="yellow p-3 border rounded">
                                    <ul class="list-group">
                                        <li class="list-group-item" th:each="desc : ${descriptionList}" th:text="${desc}"></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Edit weitereitung -->
            <a th:href="@{/edit(id=${npc.id})}" class="btn btn-primary">
                edit NPC
            </a>

        </div>
    </body>

    <!-- Bootstrap JavaScript über CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
</html>
